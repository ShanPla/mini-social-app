<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- Icons: .ico for older clients and Safari tabs, SVG for everything current, 180px for iOS home screens -->
    <link rel="icon" href="/favicon.ico" sizes="32x32" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="theme-color" content="#faf8f4" />

    <title>The Chronicle</title>
    <meta name="description" content="A small social network: share posts with photos, follow people, and chat in real time." />

    <!-- Link previews (Slack, iMessage, Facebook, Twitter and friends) -->
    <meta property="og:site_name" content="The Chronicle" />
    <meta property="og:title" content="The Chronicle" />
    <meta property="og:description" content="Share your story, one post at a time." />
    <meta property="og:type" content="website" />
    <!-- These have to be absolute; the host is stamped in at build time (see vite.config.ts) -->
    <meta property="og:url" content="__SITE_URL__/" />
    <meta property="og:image" content="__SITE_URL__/og.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="The Chronicle. Share your story, one post at a time." />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="The Chronicle" />
    <meta name="twitter:description" content="Share your story, one post at a time." />
    <meta name="twitter:image" content="__SITE_URL__/og.png" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
